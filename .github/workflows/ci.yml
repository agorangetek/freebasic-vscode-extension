name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Bundle
        run: npm run build

      - name: Package VSIX
        run: npx vsce package --out freebasic.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: freebasic-vsix
          path: freebasic.vsix
          if-no-files-found: error
